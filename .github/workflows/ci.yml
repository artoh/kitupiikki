name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6 and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            qt6-base-dev \
            qt6-base-dev-tools \
            libgl-dev

      - name: Build and run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          qmake6 -v
          tests=(
            unittest/eurotest/eurotest.pro
            unittest/viitetesti/viitetesti.pro
            unittest/ValidatorTest/ValidatorTest.pro
            unittest/KieliTesti/KieliTesti.pro
            unittest/tositerivitesti/tositerivitesti.pro
          )
          for pro in "${tests[@]}"; do
            name="$(basename "$pro" .pro)"
            echo "::group::Build and run $name"
            mkdir -p "build-tests/$name"
            (
              cd "build-tests/$name"
              qmake6 "../../$pro" -spec linux-g++ "CONFIG+=release"
              make -j"$(nproc)"
              "./$name"
            )
            echo "::endgroup::"
          done

  db-parity:
    name: SQLite vs PostgreSQL parity
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kitsas
          POSTGRES_PASSWORD: kitsas
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kitsas -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      QT_QPA_PLATFORM: offscreen
      KITSAS_REQUIRE_POSTGRES: "1"
      KITSAS_PG_HOST: localhost
      KITSAS_PG_PORT: "5432"
      KITSAS_PG_USER: kitsas
      KITSAS_PG_PASSWORD: kitsas
      KITSAS_PG_ADMIN_DB: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libzip-dev \
            libgl-dev \
            libpq5 \
            libpq-dev \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libnss3 \
            libnspr4 \
            libdbus-1-3 \
            libasound2t64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.3"
          cache: true
          modules: >-
            qtwebengine
            qtwebchannel
            qtpositioning
            qt5compat
            qtpdf

      - name: Build and run dbparity
        run: |
          set -euo pipefail
          mkdir -p build-tests/dbparity
          cd build-tests/dbparity
          qmake ../../unittest/dbparity/dbparity.pro -spec linux-g++ "CONFIG+=release"
          make -j"$(nproc)"
          ./dbparity

  build:
    name: Build Kitsas
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libzip-dev \
            libgl-dev \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libnss3 \
            libnspr4 \
            libdbus-1-3 \
            libasound2t64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.3"
          cache: true
          modules: >-
            qtwebengine
            qtwebchannel
            qtpositioning
            qt5compat
            qtpdf

      - name: Build Kitsas
        run: |
          set -euo pipefail
          mkdir -p build
          cd build
          qmake ../kitsas/kitsas.pro -spec linux-g++ "CONFIG+=release"
          make -j"$(nproc)"
          test -x kitsas

  build-macos:
    name: Build Kitsas (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.3"
          cache: true
          arch: clang_64
          modules: >-
            qtwebengine
            qtwebchannel
            qtpositioning
            qt5compat
            qtpdf

      - name: Generate Xcode project and build
        run: |
          set -euo pipefail
          qmake -v
          mkdir -p build-macos
          cd build-macos
          qmake ../kitsas/kitsas.pro -spec macx-xcode
          xcodebuild \
            -project kitsas.xcodeproj \
            -target kitsas \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=-
          test -d build/Release/kitsas.app
          mv build/Release/kitsas.app build/Release/Kitsas.app

      - name: Bundle Qt frameworks and package ZIP
        run: |
          set -euo pipefail
          app="build-macos/build/Release/Kitsas.app"
          test -d "$app"
          macdeployqt "$app"
          ditto -c -k --keepParent "$app" build-macos/build/Release/Kitsas-macOS.zip

      - name: Upload Kitsas-macOS
        uses: actions/upload-artifact@v4
        with:
          name: Kitsas-macOS
          path: build-macos/build/Release/Kitsas-macOS.zip
          if-no-files-found: error
