name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6 and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            qt6-base-dev \
            qt6-base-dev-tools \
            libgl-dev

      - name: Build and run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          qmake6 -v
          tests=(
            unittest/eurotest/eurotest.pro
            unittest/viitetesti/viitetesti.pro
            unittest/ValidatorTest/ValidatorTest.pro
            unittest/KieliTesti/KieliTesti.pro
            unittest/tositerivitesti/tositerivitesti.pro
          )
          for pro in "${tests[@]}"; do
            name="$(basename "$pro" .pro)"
            echo "::group::Build and run $name"
            mkdir -p "build-tests/$name"
            (
              cd "build-tests/$name"
              qmake6 "../../$pro" -spec linux-g++ "CONFIG+=release"
              make -j"$(nproc)"
              "./$name"
            )
            echo "::endgroup::"
          done

  build:
    name: Build Kitsas
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libzip-dev \
            libgl-dev \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libnss3 \
            libnspr4 \
            libdbus-1-3 \
            libasound2t64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.3"
          cache: true
          modules: >-
            qtwebengine
            qtwebchannel
            qtpositioning
            qt5compat
            qtpdf

      - name: Build Kitsas
        run: |
          set -euo pipefail
          mkdir -p build
          cd build
          qmake ../kitsas/kitsas.pro -spec linux-g++ "CONFIG+=release"
          make -j"$(nproc)"
          test -x kitsas
